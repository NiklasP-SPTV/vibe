name: Release

on:
    workflow_dispatch:
        inputs:
            sign-windows:
                description: 'Sign Windows binaries via remote YubiKey'
                type: boolean
                default: false
            sign-macos:
                description: 'Sign and notarize macOS binaries with Apple Developer ID'
                type: boolean
                default: false

jobs:
    publish-tauri:
        timeout-minutes: 120
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                      target_triple: "aarch64-apple-darwin"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                      target_triple: "x86_64-apple-darwin"
                    - platform: "ubuntu-22.04"
                      args: "--target x86_64-unknown-linux-gnu"
                      target_triple: "x86_64-unknown-linux-gnu"
                    - platform: "ubuntu-22.04-arm"
                      args: "--target aarch64-unknown-linux-gnu"
                      target_triple: "aarch64-unknown-linux-gnu"
                    - platform: "windows-latest"
                      args: "--target x86_64-pc-windows-msvc"
                      target_triple: "x86_64-pc-windows-msvc"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup uv
              uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

            - name: setup chore
              uses: getchore/setup-chore@c8328e6967f11b7fb80b5f75f000066586ccf891 # v1
              with:
                  version: v1.6.0

            - name: Rust cache
              uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install frontend dependencies
              run: pnpm install
              working-directory: ./desktop

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: chore linux-deps

            - name: Require release notes for this version
              shell: bash
              run: |
                  version=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')
                  test -f "i18n/changelog/$version.md" || { echo "::error::i18n/changelog/$version.md is missing; write the release notes before releasing"; exit 1; }
            - name: Fetch the sidecars for ${{ matrix.target_triple }}
              run: chore setup ${{ matrix.target_triple }}

            - name: Build
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # Tauri Updater
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  # macOS signing: only this step sees the Apple secrets, and only when signing is asked for (IT review M10)
                  APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && inputs.sign-macos && secrets.APPLE_CERTIFICATE || '' }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && inputs.sign-macos && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
                  APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && inputs.sign-macos && secrets.APPLE_SIGNING_IDENTITY || '' }}
                  APPLE_ID: ${{ matrix.platform == 'macos-latest' && inputs.sign-macos && secrets.APPLE_ID || '' }}
                  APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && inputs.sign-macos && secrets.APPLE_PASSWORD || '' }}
                  APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && inputs.sign-macos && secrets.APPLE_TEAM_ID || '' }}
                  # Windows signing (remote YubiKey sign server)
                  SIGN_ENABLED: ${{ matrix.platform == 'windows-latest' && inputs.sign-windows && 'true' || 'false' }}
                  SIGN_TUNNEL_URL: ${{ secrets.SIGN_TUNNEL_URL }}
                  SIGN_TUNNEL_SECRET: ${{ secrets.SIGN_TUNNEL_SECRET }}
              with:
                  tagName: v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
                  releaseName: "v__VERSION__"
                  releaseBody: "Release notes: https://github.com/NiklasP-SPTV/vibe/blob/main/i18n/changelog/__VERSION__.md\n\nUnsigned build."
                  prerelease: true
                  args: ${{ matrix.args }} ${{ matrix.platform == 'windows-latest' && inputs.sign-windows && '--config src-tauri/tauri.windows.signing.conf.json' || '' }}
                  projectPath: "./desktop"
                  tauriScript: pnpm exec tauri

            # Unsigned macOS builds need the quarantine flag removed once after installing. Tauri cannot put
            # extra files into the DMG, so the finished image is opened, given the note and uploaded again.
            # Best effort: if anything here fails, the plain DMG from the build step stays in the release.
            - name: Add the install note to the DMG
              if: matrix.platform == 'macos-latest' && !inputs.sign-macos
              continue-on-error: true
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  version=$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')
                  dmg=$(ls target/${{ matrix.target_triple }}/release/bundle/dmg/*.dmg | head -1)
                  note="desktop/src-tauri/dmg/ZUERST LESEN - Installation.txt"
                  work=$(mktemp -d)
                  hdiutil convert "$dmg" -format UDRW -o "$work/rw.dmg"
                  # The read-write copy is sized to its contents; give the note room.
                  size_mb=$(( $(stat -f%z "$work/rw.dmg") / 1048576 + 16 ))
                  hdiutil resize -size "${size_mb}m" "$work/rw.dmg"
                  mount=$(hdiutil attach "$work/rw.dmg" -readwrite -noverify -noautoopen | grep -o '/Volumes/.*' | head -1)
                  cp "$note" "$mount/"
                  # Place it above "drag and drop"; Finder scripting may be unavailable on the runner.
                  osascript <<APPLESCRIPT || echo "::warning::could not position the install note"
                  tell application "Finder"
                      tell disk "$(basename "$mount")"
                          open
                          set position of item "$(basename "$note")" of container window to {360, 62}
                          update without registering applications
                          delay 1
                          close
                      end tell
                  end tell
                  APPLESCRIPT
                  sync
                  hdiutil detach "$mount" || hdiutil detach -force "$mount"
                  hdiutil convert "$work/rw.dmg" -format UDZO -imagekey zlib-level=9 -ov -o "$dmg"
                  gh release upload "v$version" "$dmg" --clobber --repo "${{ github.repository }}"
