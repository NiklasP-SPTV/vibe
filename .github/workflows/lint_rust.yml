name: Lint Rust

on:
    # push:
    #   branches:
    #     - main
    pull_request:
        paths:
            - '.github/workflows/lint.yml'
            - 'desktop/src-tauri/**'
            - 'cli/src/**'
    workflow_dispatch:

env:
    RUST_BACKTRACE: 1
    CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    fmt:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: install Rust stable and rustfmt
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  components: rustfmt

            - name: Run cargo fmt
              run: cargo fmt --manifest-path Cargo.toml --all -- --check

    clippy:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: install Rust stable and clippy
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  components: clippy
            - name: setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  package_json_file: desktop/package.json

            - name: setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: desktop/pnpm-lock.yaml

            - name: setup chore
              uses: getchore/setup-chore@c8328e6967f11b7fb80b5f75f000066586ccf891 # v1
              with:
                  version: v1.6.0

            - name: Fetch the sidecars
              run: chore setup

            - name: install node deps
              run: pnpm install
              working-directory: ./desktop
            - name: build react
              run: pnpm build
              working-directory: ./desktop

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: run Clippy
              run: cargo clippy --manifest-path Cargo.toml --all-targets -- -D warnings
